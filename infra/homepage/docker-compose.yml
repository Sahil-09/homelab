services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    user: "1000:983"

    restart: unless-stopped

    environment:
      - HOMEPAGE_ALLOWED_HOSTS=home.patelsahil.in
      - HOMEPAGE_VAR_PORTAINER_TOKEN=${PORTAINER_TOKEN}

    volumes:
      - ./config:/app/config
      - ./images:/app/public/images
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - proxy

    labels:
      - traefik.enable=true
      - traefik.http.routers.homepage.rule=Host(`home.patelsahil.in`)
      - traefik.http.routers.homepage.entrypoints=websecure
      - traefik.http.routers.homepage.tls=true
      - traefik.http.routers.homepage.middlewares=secure-headers@file,compress@file
      - traefik.http.services.homepage.loadbalancer.server.port=3000

    security_opt:
      - no-new-privileges:true

    env_file:
      - ../../.env

networks:
  proxy:
    external: true
