- greeting:
    text_size: xl
    text: "HomeLab"

- logo:
    icon: mdi-server

- datetime:
    text_size: m
    format:
      dateStyle: long
      timeStyle: short

- resources:
    cpu: true
    memory: true
    cputemp: true
    uptime: true
    network: true
    units: imperial
    refresh: 2000

- search:
    provider: duckduckgo
    focus: false
    show_providers: true
    target: _blank

