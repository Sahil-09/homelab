- Administration & System:
    - Traefik:
        href: https://traefik.patelsahil.in
        description: Reverse Proxy
        icon: traefik.png
        server: my-docker
        container: traefik

    - Portainer:
        href: https://portainer.patelsahil.in
        description: Docker Management
        icon: portainer.png
        server: my-docker
        container: portainer
        widget:
          type: portainer
          url: http://portainer:9000
          env: 3
          showContainerCount: true
          key: "{{HOMEPAGE_VAR_PORTAINER_TOKEN}}"

    - Homepage:
        href: https://home.patelsahil.in
        description: Dashboard
        icon: homepage.png
        server: my-docker
        container: homepage

