services:
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_HOST_PASSWORD}
    volumes:
      - /home/kraddy/homelab/data/redis:/data
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../../.env

networks:
  proxy:
    external: true
