services:
  code-server:
    image: lscr.io/linuxserver/code-server:4.105.1
    container_name: code-server

    restart: unless-stopped

    ports:
      - "8443:8443"

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PASSWORD=${PASSWORD}
      - DEFAULT_WORKSPACE=${WORKSPACE}

    volumes:
      - ./config:/config
      - /home/kraddy:/home/kraddy

    networks:
      - proxy

    labels:
       - traefik.enable=true

      - traefik.http.routers.code.rule=Host(`code.home.patelsahil.in`)
      - traefik.http.routers.code.entrypoints=websecure
      - traefik.http.routers.code.tls=true

      - traefik.http.routers.code.middlewares=secure-headers@file,compress@file

      - traefik.http.services.code.loadbalancer.server.port=8443

    security_opt:
      - no-new-privileges:false

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  proxy:
    external: true
