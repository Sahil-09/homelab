services:
  portainer:
    image: portainer/portainer-ce:2.33.2
    container_name: portainer

    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9443:9443"

    labels:
      - traefik.enable=true

      - traefik.http.routers.code.rule=Host(`portainer.home.patelsahil.in`)
      - traefik.http.routers.code.entrypoints=web

      - traefik.http.services.portainer.loadbalancer.server.port=8443  

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data

    security_opt:
      - no-new-privileges:true

volumes:
  portainer_data:
    external: true