services:
  portainer:
    image: portainer/portainer-ce:2.33.2
    container_name: portainer

    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9443:9443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9000"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  portainer_data:
    external: true