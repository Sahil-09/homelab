services:
  infisical:
    image: infisical/infisical:latest
    container_name: infisical
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SITE_URL=${INFISICAL_SITE_URL}
      - PORT=8080
      - DB_CONNECTION_URI=postgresql://${INFISICAL_DB_USER}:${INFISICAL_DB_PASSWORD}@postgres:5432/${INFISICAL_DB_NAME}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_HOST_PASSWORD}@redis:6379/0
      - ENCRYPTION_KEY=${INFISICAL_ENCRYPTION_KEY}
      - AUTH_SECRET=${INFISICAL_AUTH_SECRET}
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.infisical.rule=Host(`infisical.patelsahil.in`)
      - traefik.http.routers.infisical.entrypoints=websecure
      - traefik.http.routers.infisical.tls=true
      - traefik.http.routers.infisical.middlewares=secure-headers@file,compress@file
      - traefik.http.services.infisical.loadbalancer.server.port=8080
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../../.env

networks:
  proxy:
    external: true
