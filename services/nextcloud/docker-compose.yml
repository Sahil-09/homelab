services:
  redis:
    image: redis:alpine
    container_name: redis

    restart: unless-stopped

    command: redis-server --requirepass ${REDIS_HOST_PASSWORD}

    volumes:
      - /home/kraddy/homelab/data/redis:/data

    networks:
      - proxy

    security_opt:
      - no-new-privileges:true

  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud

    restart: unless-stopped

    depends_on:
      - redis

    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${NEXTCLOUD_DB_NAME}
      - POSTGRES_USER=${NEXTCLOUD_DB_USER}
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_HOST_PASSWORD=${REDIS_HOST_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=nextcloud.patelsahil.in
      - TRUSTED_PROXIES=traefik
      - OVERWRITEPROTOCOL=https
      - TZ=${TZ}

    volumes:
      - /home/kraddy/homelab/data/nextcloud:/var/www/html

    networks:
      - proxy

    dns:
      - 1.1.1.1
      - 8.8.8.8

    labels:
      - traefik.enable=true
      - traefik.http.routers.nextcloud.rule=Host(`nextcloud.patelsahil.in`)
      - traefik.http.routers.nextcloud.entrypoints=websecure
      - traefik.http.routers.nextcloud.tls=true
      - traefik.http.routers.nextcloud.middlewares=secure-headers@file,compress@file
      - traefik.http.services.nextcloud.loadbalancer.server.port=80

    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    external: true
