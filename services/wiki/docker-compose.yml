services:
  wiki:
    image: ghcr.io/requarks/wiki:2
    container_name: wiki

    restart: unless-stopped

    environment:
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${WIKI_DB_USER}
      - DB_PASS=${WIKI_DB_PASSWORD}
      - DB_NAME=${WIKI_DB_NAME}
      - WIKI_ADMIN_EMAIL=${EMAIL}

    volumes:
      - wiki_data:/var/wiki

    networks:
      - proxy

    labels:
      - traefik.enable=true
      - traefik.http.routers.wiki.rule=Host(`wiki.patelsahil.in`)
      - traefik.http.routers.wiki.entrypoints=websecure
      - traefik.http.routers.wiki.tls=true
      - traefik.http.routers.wiki.middlewares=secure-headers@file
      - traefik.http.services.wiki.loadbalancer.server.port=3000

    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    external: true

volumes:
  wiki_data:
